<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Register | PureOre Nexus</title>
    <meta name="description" content="Create your PureOre Nexus account with email and password." />

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js",
                "firebase/functions": "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js"
            }
        }
    </script>

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-glow: rgba(201, 168, 76, 0.3);
            --gold-subtle: rgba(201, 168, 76, 0.1);
            --charcoal: #1a1a1a;
            --dark: #0b0b0b;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.07);
            --text-white: #f5f3f0;
            --text-muted: rgba(245, 243, 240, 0.55);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--text-white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        /* ===== LOADING SCREEN ===== */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .load-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .load-logo-symbol {
            width: 64px;
            height: 64px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            background: rgba(201, 168, 76, 0.04);
            box-shadow: 0 0 40px rgba(201, 168, 76, 0.06);
            position: relative;
        }
        .load-logo-symbol::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--gold);
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .load-logo-symbol svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--gold);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .load-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-white);
        }
        .load-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .load-progress-wrap {
            width: 180px;
            max-width: 60vw;
            margin-top: 1.8rem;
        }
        .load-progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .load-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gold);
            border-radius: 4px;
            box-shadow: 0 0 16px var(--gold-glow);
            transition: width 0.15s linear;
        }
        .load-msg {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-top: 0.7rem;
            text-align: center;
            min-height: 1.2em;
        }

        /* ===== MAIN REGISTRATION ===== */
        #main-register {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 0.9s ease, transform 1s ease;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        #main-register.visible {
            opacity: 1;
            transform: scale(1);
        }

        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-color: #0b0b0b;
            background-image: url('https://images.unsplash.com/photo-1603386329225-868f9b1c6e4f?w=1200&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at 50% 30%, rgba(11, 11, 11, 0.3) 0%, rgba(11, 11, 11, 0.85) 80%, #0b0b0b 100%);
            pointer-events: none;
        }

        .register-scroll {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 120px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== REGISTRATION CARD ===== */
        .reg-card {
            width: 100%;
            background: rgba(11, 11, 11, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 28px 22px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 60px rgba(201, 168, 76, 0.03);
            position: relative;
            overflow: hidden;
        }
        .reg-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.5;
        }

        .reg-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .reg-header .brand-icon {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .reg-header .brand-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
        }
        .reg-header .brand-icon span {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-white);
        }
        .reg-header .brand-icon span em {
            color: var(--gold);
            font-style: normal;
        }
        .reg-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 6px;
            letter-spacing: -0.01em;
        }
        .reg-header .step-indicator {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            margin-top: 4px;
            font-weight: 300;
        }
        .reg-header .sub-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 300;
        }

        /* ===== FORM ELEMENTS ===== */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            color: var(--text-white);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }
        .form-control.error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }
        .form-control.success {
            border-color: var(--gold);
        }

        .form-error {
            font-size: 0.7rem;
            color: #e74c3c;
            margin-top: 4px;
            min-height: 1.2em;
        }

        /* ===== PIN BOXES ===== */
        .pin-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 8px 0 4px;
        }
        .pin-container .pin-box {
            width: 44px;
            height: 54px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            color: var(--text-white);
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .pin-container .pin-box:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.08);
        }
        .pin-container .pin-box.error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.08);
        }
        .pin-container .pin-box.hidden-pin {
            -webkit-text-security: disc;
            text-security: disc;
        }

        .pin-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            margin-top: 6px;
            justify-content: center;
        }
        .pin-toggle:hover {
            color: var(--text-white);
        }
        .pin-toggle input[type="checkbox"] {
            accent-color: var(--gold);
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        /* ===== CHECKBOX ===== */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            accent-color: var(--gold);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 1px;
            cursor: pointer;
        }
        .checkbox-group .checkbox-label {
            cursor: pointer;
            line-height: 1.4;
        }
        .checkbox-group .checkbox-label a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 400;
        }
        .checkbox-group .checkbox-label a:hover {
            text-decoration: underline;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.35s ease;
            font-family: inherit;
            position: relative;
            min-height: 54px;
            background: var(--gold);
            color: #0b0b0b;
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.12);
        }
        .btn:hover:not(:disabled) {
            background: #dbb95c;
            box-shadow: 0 0 50px rgba(201, 168, 76, 0.2);
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(11, 11, 11, 0.15);
            border-top-color: #0b0b0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        .btn.loading .spinner {
            display: inline-block;
        }
        .btn.loading .btn-text {
            opacity: 0.7;
        }

        .btn-success {
            background: #27ae60;
            color: #fff;
            box-shadow: 0 0 30px rgba(39, 174, 96, 0.15);
        }
        .btn-success:hover:not(:disabled) {
            background: #2ecc71;
            box-shadow: 0 0 50px rgba(39, 174, 96, 0.2);
        }

        .mt-12 {
            margin-top: 12px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-gold {
            color: var(--gold);
        }
        .text-sm {
            font-size: 0.75rem;
        }
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            margin: 16px 0;
        }

        /* ===== STEPS ===== */
        .step {
            display: none;
            animation: fadeSlide 0.4s ease forwards;
        }
        .step.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== SUCCESS SCREEN ===== */
        .success-screen {
            text-align: center;
            padding: 16px 0 8px;
        }
        .success-screen .checkmark {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(39, 174, 96, 0.12);
            border: 2px solid #27ae60;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            animation: popIn 0.6s ease;
        }
        .success-screen .checkmark svg {
            width: 36px;
            height: 36px;
            stroke: #27ae60;
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .success-screen h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .success-screen p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        /* ===== CONFIRMATION CARD ===== */
        .confirm-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.85rem;
        }
        .confirm-item .label {
            color: var(--text-muted);
        }
        .confirm-item .value {
            font-weight: 400;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }

        /* ===== MODAL LOADING OVERLAY ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(11, 11, 11, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            padding: 32px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-overlay .modal-spinner {
            width: 44px;
            height: 44px;
            border: 2.5px solid rgba(201, 168, 76, 0.15);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .modal-overlay .modal-msg {
            font-size: 0.9rem;
            color: var(--text-white);
            letter-spacing: 0.05em;
            text-align: center;
            font-weight: 300;
        }
        .modal-overlay .modal-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            .reg-card {
                padding: 20px 14px 24px;
                border-radius: 14px;
            }
            .reg-header h2 {
                font-size: 1.05rem;
            }
            .pin-container .pin-box {
                width: 38px;
                height: 46px;
                font-size: 1.4rem;
            }
            .btn {
                font-size: 0.7rem;
                min-height: 48px;
                padding: 12px 16px;
            }
            .form-control {
                padding: 12px 14px;
                font-size: 0.9rem;
            }
            .confirm-item {
                font-size: 0.75rem;
                padding: 8px 0;
            }
        }

        @media (max-width: 360px) {
            .pin-container {
                gap: 5px;
            }
            .pin-container .pin-box {
                width: 32px;
                height: 40px;
                font-size: 1.2rem;
            }
            .reg-card {
                padding: 16px 10px 20px;
            }
        }

        @media (min-height: 800px) {
            .register-scroll {
                padding: 40px 16px 120px;
            }
            .reg-card {
                padding: 36px 28px 40px;
            }
        }

        /* ===== SCROLLBAR ===== */
        #main-register::-webkit-scrollbar {
            width: 3px;
        }
        #main-register::-webkit-scrollbar-track {
            background: transparent;
        }
        #main-register::-webkit-scrollbar-thumb {
            background: rgba(201, 168, 76, 0.2);
            border-radius: 10px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .login-link-bottom {
            text-align: center;
            margin-top: 18px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .login-link-bottom a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }
        .login-link-bottom a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loading-screen" role="status" aria-label="Loading">
        <div class="load-logo">
            <div class="load-logo-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" />
                    <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M6.5 17.5l2-2M15.5 8.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                    <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6" fill="none" />
                </svg>
            </div>
            <div class="load-title">PureOre Nexus</div>
            <div class="load-sub">Automotive Investment Network</div>
        </div>
        <div class="load-progress-wrap">
            <div class="load-progress-track">
                <div class="load-progress-bar" id="load-bar" style="width:0%;"></div>
            </div>
            <div class="load-msg" id="load-msg">Preparing your registration...</div>
        </div>
    </div>

    <!-- ===== MAIN REGISTRATION ===== -->
    <div id="main-register">
        <div class="bg-wrap" aria-hidden="true"></div>
        <div class="bg-overlay" aria-hidden="true"></div>

        <div class="register-scroll">
            <div class="reg-card" role="main" aria-label="Registration form">

                <!-- HEADER -->
                <div class="reg-header">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" />
                            <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M6.5 17.5l2-2M15.5 8.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                            <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6" fill="none" />
                        </svg>
                        <span>Pure<em>Ore</em> Nexus</span>
                    </div>
                    <h2 id="step-title">Create your account</h2>
                    <div class="step-indicator" id="step-indicator">Step 1 of 5</div>
                    <div class="sub-desc" id="step-desc">Start with your email and password</div>
                </div>

                <!-- ===== STEP 1 — EMAIL & PASSWORD ===== -->
                <div class="step active" id="step-1">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" id="email-input" placeholder="you@example.com" autocomplete="email" />
                        <div class="form-error" id="email-error"></div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control" id="password-input" placeholder="Min. 6 characters" autocomplete="new-password" />
                        <div class="form-error" id="password-error"></div>
                    </div>
                    <button class="btn mt-12" id="btn-email-continue">
                        <span class="spinner"></span>
                        <span class="btn-text">Continue</span>
                    </button>
                </div>

                <!-- ===== STEP 2 — FULL NAME ===== -->
                <div class="step" id="step-2">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" id="fullname-input" placeholder="e.g. John Doe" autocomplete="name" />
                        <div class="form-error" id="name-error"></div>
                    </div>
                    <button class="btn mt-12" id="btn-name-continue">
                        <span class="spinner"></span>
                        <span class="btn-text">Continue</span>
                    </button>
                </div>

                <!-- ===== STEP 3 — CREATE PIN ===== -->
                <div class="step" id="step-3">
                    <div class="form-group">
                        <label>Create 6-digit PIN</label>
                        <div class="pin-container" id="pin-create-container">
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                        </div>
                        <div class="form-error" id="pin-create-error"></div>
                        <div class="pin-toggle">
                            <input type="checkbox" id="pin-show-toggle" />
                            <label for="pin-show-toggle">Show PIN</label>
                        </div>
                    </div>
                    <button class="btn mt-12" id="btn-pin-continue">
                        <span class="spinner"></span>
                        <span class="btn-text">Continue</span>
                    </button>
                </div>

                <!-- ===== STEP 4 — CONFIRM PIN ===== -->
                <div class="step" id="step-4">
                    <div class="form-group">
                        <label>Confirm your 6-digit PIN</label>
                        <div class="pin-container" id="pin-confirm-container">
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                            <input type="password" class="pin-box hidden-pin" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                        </div>
                        <div class="form-error" id="pin-confirm-error"></div>
                        <div class="pin-toggle">
                            <input type="checkbox" id="pin-confirm-show-toggle" />
                            <label for="pin-confirm-show-toggle">Show PIN</label>
                        </div>
                    </div>
                    <button class="btn mt-12" id="btn-pin-confirm">
                        <span class="spinner"></span>
                        <span class="btn-text">Continue</span>
                    </button>
                </div>

                <!-- ===== STEP 5 — CONFIRM & CREATE ===== -->
                <div class="step" id="step-5">
                    <div style="text-align:center;margin-bottom:12px;">
                        <div style="font-size:0.7rem;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;">You're ready to join</div>
                        <div style="font-size:1.1rem;font-weight:600;margin-top:2px;">PureOre Nexus</div>
                    </div>

                    <div class="confirm-item">
                        <span class="label">Email</span>
                        <span class="value" id="confirm-email">—</span>
                    </div>
                    <div class="confirm-item">
                        <span class="label">Full Name</span>
                        <span class="value" id="confirm-name">—</span>
                    </div>

                    <div class="divider"></div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms-check" />
                        <label for="terms-check" class="checkbox-label">
                            I agree to the <a href="#" id="terms-link">Terms and Conditions</a>
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="privacy-check" />
                        <label for="privacy-check" class="checkbox-label">
                            I agree to the <a href="#" id="privacy-link">Privacy Policy</a>
                        </label>
                    </div>
                    <div class="form-error" id="agree-error"></div>

                    <button class="btn btn-success mt-12" id="btn-create-account">
                        <span class="spinner"></span>
                        <span class="btn-text">Create Account</span>
                    </button>
                </div>

                <!-- ===== LOGIN LINK ===== -->
                <div class="login-link-bottom">
                    Already have an account? <a href="login.html">Login</a>
                </div>

            </div>
        </div>
    </div>

    <!-- ===== MODAL LOADING OVERLAY ===== -->
    <div class="modal-overlay" id="modal-loading">
        <div class="modal-spinner"></div>
        <div class="modal-msg" id="modal-msg">Processing...</div>
        <div class="modal-sub" id="modal-sub">Please wait</div>
    </div>

    <!-- ============================================================
    FIREBASE + APPLICATION LOGIC (Email/Password)
    ============================================================ -->
    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from 'firebase/app';
        import {
            getAuth,
            createUserWithEmailAndPassword,
            onAuthStateChanged
        } from 'firebase/auth';
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            runTransaction,
            serverTimestamp
        } from 'firebase/firestore';
        import { getFunctions } from 'firebase/functions';

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD2nHDM2ebNv9pUUoIhsfJUCSLlffWYW1w",
            authDomain: "pureore-nexus.firebaseapp.com",
            projectId: "pureore-nexus",
            storageBucket: "pureore-nexus.firebasestorage.app",
            messagingSenderId: "555338198187",
            appId: "1:555338198187:web:0c510ca507fa4c835a5bee",
            measurementId: "G-L2B5FEMH2C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);

        // ============================================================
        // STATE
        // ============================================================
        let currentStep = 1;
        let isSubmitting = false;
        let authUser = null;
        let createdPin = '';
        let userEmail = '';
        let userPassword = '';

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const loadScreen = $('loading-screen');
        const loadBar = $('load-bar');
        const loadMsg = $('load-msg');
        const mainReg = $('main-register');

        const stepTitle = $('step-title');
        const stepIndicator = $('step-indicator');
        const stepDesc = $('step-desc');

        const emailInput = $('email-input');
        const emailError = $('email-error');
        const passwordInput = $('password-input');
        const passwordError = $('password-error');

        const fullnameInput = $('fullname-input');
        const nameError = $('name-error');

        const pinCreateBoxes = document.querySelectorAll('#pin-create-container .pin-box');
        const pinCreateError = $('pin-create-error');
        const pinShowToggle = $('pin-show-toggle');

        const pinConfirmBoxes = document.querySelectorAll('#pin-confirm-container .pin-box');
        const pinConfirmError = $('pin-confirm-error');
        const pinConfirmShowToggle = $('pin-confirm-show-toggle');

        const confirmEmail = $('confirm-email');
        const confirmName = $('confirm-name');
        const termsCheck = $('terms-check');
        const privacyCheck = $('privacy-check');
        const agreeError = $('agree-error');

        const modalOverlay = $('modal-loading');
        const modalMsg = $('modal-msg');
        const modalSub = $('modal-sub');

        // ============================================================
        // LOADING SCREEN
        // ============================================================
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += 2;
            if (loadProgress >= 100) {
                clearInterval(loadInterval);
                loadBar.style.width = '100%';
                loadMsg.textContent = 'Ready';
                setTimeout(() => {
                    loadScreen.classList.add('hidden');
                    mainReg.classList.add('visible');
                    document.body.style.overflow = 'auto';
                    setTimeout(() => emailInput.focus(), 300);
                }, 400);
                return;
            }
            loadBar.style.width = loadProgress + '%';
            if (loadProgress > 70) loadMsg.textContent = 'Almost ready...';
            else if (loadProgress > 40) loadMsg.textContent = 'Securing your registration...';
            else if (loadProgress > 15) loadMsg.textContent = 'Preparing your registration...';
        }, 35);

        // ============================================================
        // STEP MANAGEMENT
        // ============================================================
        const stepTitles = [
            'Create your account',
            'What\'s your full name?',
            'Create your security PIN',
            'Confirm your security PIN',
            'You\'re ready to join PureOre Nexus'
        ];
        const stepDescs = [
            'Start with your email and password',
            'Tell us your full name',
            'Create a 6-digit PIN to protect your account',
            'Enter your PIN again to confirm',
            'Review your details and create your account'
        ];

        function goToStep(step) {
            currentStep = step;
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(`step-${step}`);
            if (target) target.classList.add('active');

            stepTitle.textContent = stepTitles[step - 1] || 'Create your account';
            stepIndicator.textContent = `Step ${step} of 5`;
            stepDesc.textContent = stepDescs[step - 1] || '';

            const firstInput = target?.querySelector('input:not([readonly])');
            if (firstInput) setTimeout(() => firstInput.focus(), 200);
        }

        // ============================================================
        // VALIDATION
        // ============================================================
        function validateEmail() {
            const email = emailInput.value.trim();
            if (!email) {
                emailError.textContent = 'Please enter your email address.';
                emailInput.classList.add('error');
                return false;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailError.textContent = 'Please enter a valid email address.';
                emailInput.classList.add('error');
                return false;
            }
            emailError.textContent = '';
            emailInput.classList.remove('error');
            userEmail = email;
            return true;
        }

        function validatePassword() {
            const pw = passwordInput.value;
            if (pw.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters.';
                passwordInput.classList.add('error');
                return false;
            }
            passwordError.textContent = '';
            passwordInput.classList.remove('error');
            userPassword = pw;
            return true;
        }

        // ============================================================
        // PIN BOX HANDLING
        // ============================================================
        function setupPinBoxes(container, errorEl, onComplete) {
            const boxes = container.querySelectorAll('.pin-box');
            boxes.forEach((box, idx) => {
                box.addEventListener('input', () => {
                    box.value = box.value.replace(/\D/g, '');
                    if (box.value && idx < 5) {
                        boxes[idx + 1].focus();
                    }
                    errorEl.textContent = '';
                    boxes.forEach(b => b.classList.remove('error'));
                    const allFilled = Array.from(boxes).every(b => b.value.length === 1);
                    if (allFilled && onComplete) {
                        onComplete(Array.from(boxes).map(b => b.value).join(''));
                    }
                });
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !box.value && idx > 0) {
                        boxes[idx - 1].focus();
                    }
                    if (e.key === 'ArrowLeft' && idx > 0) {
                        boxes[idx - 1].focus();
                    }
                    if (e.key === 'ArrowRight' && idx < 5) {
                        boxes[idx + 1].focus();
                    }
                });
                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const data = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = data.replace(/\D/g, '').slice(0, 6);
                    if (digits.length === 0) return;
                    for (let i = 0; i < Math.min(digits.length, 6); i++) {
                        boxes[i].value = digits[i];
                    }
                    const lastIdx = Math.min(digits.length, 6) - 1;
                    boxes[lastIdx].focus();
                    errorEl.textContent = '';
                    boxes.forEach(b => b.classList.remove('error'));
                    const allFilled = Array.from(boxes).every(b => b.value.length === 1);
                    if (allFilled && onComplete) {
                        onComplete(Array.from(boxes).map(b => b.value).join(''));
                    }
                });
            });
            return boxes;
        }

        let pinCreateBoxesRef = [];
        let pinConfirmBoxesRef = [];

        function initPinBoxes() {
            pinCreateBoxesRef = setupPinBoxes(
                document.getElementById('pin-create-container'),
                pinCreateError,
                (pin) => { /* auto-advance handled by button */ }
            );
            pinConfirmBoxesRef = setupPinBoxes(
                document.getElementById('pin-confirm-container'),
                pinConfirmError,
                (pin) => { /* auto-advance handled by button */ }
            );
        }
        initPinBoxes();

        pinShowToggle.addEventListener('change', () => {
            pinCreateBoxes.forEach(b => {
                b.type = pinShowToggle.checked ? 'text' : 'password';
                b.classList.toggle('hidden-pin', !pinShowToggle.checked);
            });
        });
        pinConfirmShowToggle.addEventListener('change', () => {
            pinConfirmBoxes.forEach(b => {
                b.type = pinConfirmShowToggle.checked ? 'text' : 'password';
                b.classList.toggle('hidden-pin', !pinConfirmShowToggle.checked);
            });
        });

        // ============================================================
        // MODAL LOADING
        // ============================================================
        function showModal(msg, sub = '') {
            modalMsg.textContent = msg;
            modalSub.textContent = sub;
            modalOverlay.classList.add('open');
        }

        function hideModal() {
            modalOverlay.classList.remove('open');
        }

        // ============================================================
        // STEP 1: Email & Password → Create User
        // ============================================================
        document.getElementById('btn-email-continue').addEventListener('click', async () => {
            if (isSubmitting) return;
            if (!validateEmail() || !validatePassword()) return;

            isSubmitting = true;
            const btn = document.getElementById('btn-email-continue');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                showModal('Creating your account...', 'Please wait');

                const userCredential = await createUserWithEmailAndPassword(auth, userEmail, userPassword);
                authUser = userCredential.user;

                hideModal();
                goToStep(2);
                fullnameInput.focus();

            } catch (error) {
                hideModal();
                console.error('Sign up error:', error);
                let msg = 'Failed to create account. Please try again.';
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        msg = 'This email is already registered. Please log in instead.';
                        break;
                    case 'auth/invalid-email':
                        msg = 'Invalid email address.';
                        break;
                    case 'auth/operation-not-allowed':
                        msg = 'Email/password sign-up is not enabled. Please enable it in Firebase Console.';
                        break;
                    case 'auth/weak-password':
                        msg = 'Password is too weak. Use at least 6 characters.';
                        break;
                    case 'auth/network-request-failed':
                        msg = 'Network error. Check your internet connection and ensure Firebase is properly configured.';
                        break;
                    default:
                        msg = error.message || 'Unknown error';
                }
                emailError.textContent = msg;
                emailInput.classList.add('error');
            } finally {
                isSubmitting = false;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });

        // ============================================================
        // STEP 2: Full Name
        // ============================================================
        document.getElementById('btn-name-continue').addEventListener('click', () => {
            const name = fullnameInput.value.trim();
            if (!name || name.length < 2) {
                nameError.textContent = 'Please enter your full name (minimum 2 characters).';
                fullnameInput.classList.add('error');
                return;
            }
            if (name.length > 60) {
                nameError.textContent = 'Name is too long.';
                fullnameInput.classList.add('error');
                return;
            }
            nameError.textContent = '';
            fullnameInput.classList.remove('error');
            goToStep(3);
            pinCreateBoxes[0].focus();
        });

        fullnameInput.addEventListener('input', () => {
            if (nameError.textContent) {
                fullnameInput.classList.remove('error');
                nameError.textContent = '';
            }
        });

        // ============================================================
        // STEP 3: Create PIN
        // ============================================================
        document.getElementById('btn-pin-continue').addEventListener('click', () => {
            const pin = Array.from(pinCreateBoxes).map(b => b.value).join('');
            if (pin.length !== 6) {
                pinCreateError.textContent = 'Please enter all 6 digits.';
                pinCreateBoxes.forEach(b => b.classList.add('error'));
                return;
            }
            if (!/^[0-9]{6}$/.test(pin)) {
                pinCreateError.textContent = 'PIN must contain only numbers.';
                pinCreateBoxes.forEach(b => b.classList.add('error'));
                return;
            }
            pinCreateError.textContent = '';
            pinCreateBoxes.forEach(b => b.classList.remove('error'));
            createdPin = pin;
            pinConfirmBoxes.forEach(b => b.value = '');
            pinConfirmError.textContent = '';
            pinConfirmBoxes.forEach(b => b.classList.remove('error'));
            goToStep(4);
            pinConfirmBoxes[0].focus();
        });

        // ============================================================
        // STEP 4: Confirm PIN
        // ============================================================
        document.getElementById('btn-pin-confirm').addEventListener('click', () => {
            const confirmPin = Array.from(pinConfirmBoxes).map(b => b.value).join('');
            if (confirmPin.length !== 6) {
                pinConfirmError.textContent = 'Please enter all 6 digits.';
                pinConfirmBoxes.forEach(b => b.classList.add('error'));
                return;
            }
            if (confirmPin !== createdPin) {
                pinConfirmError.textContent = 'PINs do not match.';
                pinConfirmBoxes.forEach(b => b.classList.add('error'));
                pinConfirmBoxes.forEach(b => b.value = '');
                pinConfirmBoxes[0].focus();
                return;
            }
            pinConfirmError.textContent = '';
            pinConfirmBoxes.forEach(b => b.classList.remove('error'));

            confirmEmail.textContent = userEmail;
            confirmName.textContent = fullnameInput.value.trim();

            goToStep(5);
            termsCheck.checked = false;
            privacyCheck.checked = false;
            agreeError.textContent = '';
        });

        // ============================================================
        // STEP 5: Create Firestore Account
        // ============================================================
        document.getElementById('btn-create-account').addEventListener('click', async () => {
            if (isSubmitting) return;

            if (!termsCheck.checked || !privacyCheck.checked) {
                agreeError.textContent = 'You must agree to the Terms and Privacy Policy.';
                return;
            }
            agreeError.textContent = '';

            if (!authUser) {
                authUser = auth.currentUser;
                if (!authUser) {
                    agreeError.textContent = 'Session expired. Please restart registration.';
                    return;
                }
            }

            const uid = authUser.uid;
            const name = fullnameInput.value.trim();

            isSubmitting = true;
            const btn = document.getElementById('btn-create-account');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                showModal('Setting up your Nexus profile...', 'Please wait');

                const userDocRef = doc(db, 'users', uid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    hideModal();
                    window.location.href = 'dashboard.html';
                    return;
                }

                const userRefCode = generateReferralCode(name);

                await runTransaction(db, async (transaction) => {
                    const userData = {
                        uid: uid,
                        fullName: name,
                        email: userEmail,
                        referralCode: userRefCode,
                        referredBy: '',
                        depositBalance: 0,
                        walletBalance: 0,
                        activityBalance: 0,
                        role: 'user',
                        isBlocked: false,
                        createdAt: serverTimestamp()
                    };
                    transaction.set(userDocRef, userData);

                    const walletRef = doc(db, 'wallets', uid);
                    const walletData = {
                        userId: uid,
                        depositBalance: 0,
                        walletBalance: 0,
                        activityBalance: 0,
                        totalDeposited: 0,
                        totalWithdrawn: 0,
                        totalInvested: 0,
                        totalEarnings: 0,
                        updatedAt: serverTimestamp()
                    };
                    transaction.set(walletRef, walletData);

                    const dailyRef = doc(db, 'dailyChecks', uid);
                    const dailyData = {
                        userId: uid,
                        currentDay: 0,
                        lastClaimDate: '',
                        totalClaims: 0,
                        totalRewards: 0,
                        isActive: true,
                        updatedAt: serverTimestamp()
                    };
                    transaction.set(dailyRef, dailyData);
                });

                hideModal();
                showSuccessAndRedirect();

            } catch (error) {
                hideModal();
                console.error('Account creation error:', error);
                let msg = 'Failed to create account. Please try again.';
                if (error.code === 'permission-denied') {
                    msg = 'Permission denied. Check your Firestore security rules.';
                } else if (error.code === 'unavailable') {
                    msg = 'Service unavailable. Please try again later.';
                }
                agreeError.textContent = msg;
            } finally {
                isSubmitting = false;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });

        // ============================================================
        // GENERATE REFERRAL CODE
        // ============================================================
        function generateReferralCode(name) {
            const prefix = name.substring(0, 2).toUpperCase();
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            const code = (prefix + random).replace(/[^A-Z0-9]/g, '');
            let final = code;
            if (final.length < 6) {
                final = final + Math.random().toString(36).substring(2, 6).toUpperCase();
            }
            if (final.length > 12) {
                final = final.substring(0, 12);
            }
            return final;
        }

        // ============================================================
        // SUCCESS SCREEN
        // ============================================================
        function showSuccessAndRedirect() {
            const step5 = document.getElementById('step-5');
            step5.innerHTML = `
                <div class="success-screen">
                    <div class="checkmark">
                        <svg viewBox="0 0 24 24">
                            <polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <h2>Welcome to PureOre Nexus</h2>
                    <p>Your account has been created successfully.</p>
                    <div style="font-size:0.7rem;color:var(--text-muted);margin-top:4px;">Redirecting to your dashboard...</div>
                </div>
            `;
            step5.style.textAlign = 'center';

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2800);
        }

        // ============================================================
        // CHECK EXISTING SESSION
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const uid = user.uid;
                const userRef = doc(db, 'users', uid);
                getDoc(userRef).then(snap => {
                    if (snap.exists()) {
                        window.location.href = 'dashboard.html';
                    }
                }).catch(() => {});
            }
        });

        // ============================================================
        // KEYBOARD ENTER SUPPORT
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (currentStep === 1 && (active === emailInput || active === passwordInput)) {
                    document.getElementById('btn-email-continue').click();
                } else if (currentStep === 2 && active === fullnameInput) {
                    document.getElementById('btn-name-continue').click();
                } else if (currentStep === 3 && active?.classList.contains('pin-box')) {
                    document.getElementById('btn-pin-continue').click();
                } else if (currentStep === 4 && active?.classList.contains('pin-box')) {
                    document.getElementById('btn-pin-confirm').click();
                }
            }
        });

        // ============================================================
        // TERMS & PRIVACY PLACEHOLDER
        // ============================================================
        document.getElementById('terms-link').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Terms and Conditions will be available soon.');
        });
        document.getElementById('privacy-link').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Privacy Policy will be available soon.');
        });

        // ============================================================
        // START
        // ============================================================
        goToStep(1);
        console.log('PureOre Nexus — Registration ready (Email/Password).');
    </script>

</body>
