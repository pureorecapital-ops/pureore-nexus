<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Login | PureOre Nexus</title>
    <meta name="description" content="Secure administrator login for PureOre Nexus." />

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"
            }
        }
    </script>

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-glow: rgba(201, 168, 76, 0.25);
            --dark: #0b0b0b;
            --charcoal: #1a1a1a;
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-white: #f5f3f0;
            --text-muted: rgba(245, 243, 240, 0.5);
            --radius: 14px;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--text-white);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(11, 11, 11, 0.5) 0%, #0b0b0b 100%);
            pointer-events: none;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.8);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand svg {
            width: 44px;
            height: 44px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 8px;
            color: var(--text-white);
        }

        .brand h1 span {
            color: var(--gold);
        }

        .brand .sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-white);
            font-size: 0.95rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        .btn-gold {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            border: none;
            border-radius: 30px;
            color: #0b0b0b;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.15s ease;
            margin-top: 8px;
        }

        .btn-gold:hover {
            background: #dbb95c;
        }

        .btn-gold:active {
            transform: scale(0.97);
        }

        .btn-gold:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.75rem;
            margin-top: 10px;
            text-align: center;
            min-height: 1.4em;
            transition: opacity 0.3s ease;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .links a {
            color: var(--gold);
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .links a:hover {
            color: #dbb95c;
            text-decoration: underline;
        }

        .separator {
            margin: 20px 0 16px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
        }

        .footer-note {
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 20px;
            opacity: 0.6;
            letter-spacing: 0.04em;
        }

        .footer-note span {
            color: var(--gold);
            opacity: 0.7;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 0.75rem;
            color: var(--text-white);
            z-index: 50;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: rgba(46, 204, 113, 0.2);
        }

        .toast.error {
            border-color: rgba(231, 76, 60, 0.2);
        }

        .toast svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .toast.success svg {
            stroke: #2ecc71;
        }
        .toast.error svg {
            stroke: #e74c3c;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }
            .brand h1 {
                font-size: 1.2rem;
            }
            .form-group input {
                padding: 12px 14px;
                font-size: 0.85rem;
            }
            .btn-gold {
                padding: 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-overlay" aria-hidden="true"></div>

    <div class="login-card">
        <div class="brand">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" />
                <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M6.5 17.5l2-2M15.5 8.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6" fill="none" />
            </svg>
            <h1>Pure<span>Ore</span> Nexus</h1>
            <div class="sub">Administrator Login</div>
        </div>

        <form id="admin-login-form" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="admin@pureorecapital.com" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
            </div>

            <button type="submit" class="btn-gold" id="login-btn">Sign In</button>

            <div class="error-msg" id="error-msg"></div>
        </form>

        <div class="links">
            <a href="login.html">← User Login</a>
            <a href="#" id="forgot-link">Forgot Password?</a>
        </div>

        <div class="separator"></div>

        <div class="footer-note">
            <span>@pureorecapital</span> 2025 &bull; Admin Access Only
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            <polyline points="22 4 12 14.01 9 11.01" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span id="toast-message">Success</span>
    </div>

    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from 'firebase/app';
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from 'firebase/auth';
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc
        } from 'firebase/firestore';

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD2nHDM2ebNv9pUUoIhsfJUCSLlffWYW1w",
            authDomain: "pureore-nexus.firebaseapp.com",
            projectId: "pureore-nexus",
            storageBucket: "pureore-nexus.firebasestorage.app",
            messagingSenderId: "555338198187",
            appId: "1:555338198187:web:0c510ca507fa4c835a5bee",
            measurementId: "G-L2B5FEMH2C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ============================================================
        // DOM REFS
        // ============================================================
        const form = document.getElementById('admin-login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        let toastTimeout = null;

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = '') {
            toastMessage.textContent = message;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // CHECK IF USER IS ADMIN
        // ============================================================
        async function isAdmin(user) {
            if (!user) return false;

            // 1. Check custom claim
            try {
                const idTokenResult = await user.getIdTokenResult();
                if (idTokenResult.claims.admin === true) return true;
            } catch (e) {
                console.warn('Could not get custom claims:', e);
            }

            // 2. Fallback: check Firestore
            try {
                const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                if (adminDoc.exists() && adminDoc.data().role === 'admin') return true;
            } catch (e) {
                console.warn('Could not check Firestore admin:', e);
            }

            // 3. Also check user document 'isAdmin' field (optional)
            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin === true) return true;
            } catch (e) {
                console.warn('Could not check user document:', e);
            }

            return false;
        }

        // ============================================================
        // HANDLE FORM SUBMIT
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorMsg.textContent = 'Please fill in all fields.';
                return;
            }

            errorMsg.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                // Sign in with email/password
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Verify admin status
                const admin = await isAdmin(user);
                if (!admin) {
                    // Not admin – sign out and show error
                    await signOut(auth);
                    errorMsg.textContent = 'You do not have administrator privileges.';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                    showToast('Access denied: Admin only.', 'error');
                    return;
                }

                // Admin – redirect to admin panel
                showToast('Welcome, Admin!', 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 600);

            } catch (error) {
                console.error('Login error:', error);
                let message = 'Invalid email or password.';
                if (error.code === 'auth/user-not-found') message = 'No account found with this email.';
                else if (error.code === 'auth/wrong-password') message = 'Incorrect password.';
                else if (error.code === 'auth/too-many-requests') message = 'Too many attempts. Please try again later.';
                errorMsg.textContent = message;
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
                showToast(message, 'error');
            }
        });

        // ============================================================
        // AUTO-REDIRECT IF ALREADY LOGGED IN AS ADMIN
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Check if they are admin
                const admin = await isAdmin(user);
                if (admin) {
                    // Already admin – redirect to admin panel
                    window.location.href = 'admin.html';
                } else {
                    // Not admin – sign out and show message
                    await signOut(auth);
                    errorMsg.textContent = 'Your account is not authorized for admin access.';
                    showToast('Access denied: Admin only.', 'error');
                }
            }
            // else stay on login page
        });

        // ============================================================
        // FORGOT PASSWORD PLACEHOLDER
        // ============================================================
        document.getElementById('forgot-link').addEventListener('click', (e) => {
            e.preventDefault();
            showToast('Contact support to reset your admin password.', '');
        });

        console.log('PureOre Nexus — Admin Login ready.');
    </script>

</body>
</html>
